server {
    listen 127.0.0.1:18081;
    listen 172.16.3.53:18081;
    server_name sockspecs.cn www.sockspecs.cn;
    root /srv/sockspecs-cn/public;
    index index.php;

    allow 127.0.0.1;
    allow 172.16.3.52;
    deny all;
    client_max_body_size 32m;
    access_log /var/log/nginx/sockspecs-cn-access.log;
    error_log /var/log/nginx/sockspecs-cn-error.log;
    add_header X-Robots-Tag "noindex, nofollow" always;

    location = /sscn-health {
        # Use a static file so the server-level source allowlist still applies.
        try_files /sscn-health.txt =503;
    }
    location / { try_files $uri $uri/ /index.php?$args; }
    location ~ /\. { deny all; }
    # Matomo vendor configuration is not a public web asset.
    location ~* ^/wp-content/plugins/matomo/.*\.ya?ml$ { deny all; }
    location = /wp-config.php { deny all; }
    location = /xmlrpc.php { deny all; }
    location ~* /(?:uploads|languages)/.*\.php$ { deny all; }
    location ~ \.php$ {
        try_files $uri =404;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        # Only the trusted TLS proxy and loopback can reach this listener.
        fastcgi_param HTTPS on;
        fastcgi_param SERVER_PORT 443;
        fastcgi_param HTTP_PROXY "";
        fastcgi_pass unix:/run/php/sockspecs-cn.sock;
        fastcgi_read_timeout 120s;
    }
}
